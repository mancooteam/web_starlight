<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spis postaci</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
<nav><a href="index.html">Strona główna</a> <a href="postacie.html">spis postaci</a></nav>
<banner></banner>
<main>
    <h1 id="header">Siema, pracujemy!</h1>
    <div class="card">
        <h2>Modyfikuj swoją postać</h2>

        <form id="characterForm">
            <table>
                <tr>
                    <td style="width: 95px;">Poziom</td>
                    <td><input type="number" id="lvl" min=1 value="1"></input></td>
                </tr>
                <tr>
                    <td style="width: 95px;">Siła</td>
                    <td><input type="number" id="s" min=1 value="1"></input></td>
                </tr>
                <tr>
                    <td style="width: 95px;">Zręczność</td>
                    <td><input type="number" id="zr" min=1 value="1"></input></td>
                </tr>
                <tr>
                    <td style="width: 95px;">Szybkość</td>
                    <td><input type="number" id="sz" min=1 value="1"></input></td>
                </tr>
                <tr>
                    <td style="width: 95px;">Odporność</td>
                    <td><input type="number" id="o" min=1 value="1"></input></td>
                </tr>
                <tr>
                    <td style="width: 95px;">HP</td>
                    <td><input type="number" id="hp" min=50 value="50"></input></td>
                </tr>
                <tr>
                    <td style="width: 95px;">Wytrzymałość</td>
                    <td><input type="number" id="w" min=50 value="50"></input></td>
                </tr>
            </table>
            <button type="submit" id="btnGuardar">Zachowaj postać</button>
        </form>

        <div id="mensaje"></div>
    </div>
</main>
<footer>mancoteam © 2026 | for Starlight rp</footer>
<script src="js/mod.js"></script>
</body>
</html>
