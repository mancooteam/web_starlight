<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spis postaci</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <nav><a href="index.html">Strona główna</a> <a href="postacie.html">spis postaci</a></nav>
    <banner></banner>
    <main>
        <h1>Siema, pracujemy!</h1>
        <div class="card">
            <h2>Nowa postać</h2>

            <form id="characterForm">
                    <table>
                        <tr>
                            <td><label for="id">ID postaci: </label></td>
                            <td><input type="number" id="id" name="id" placeholder="000"></td>
                        </tr>
                        <tr>
                            <td><label for="imie">Imię: </label></td>
                            <td><input type="text" id="imie" name="imie" required></td>
                        </tr>
                        <tr>
                            <td><label for="klan">Klan: </label></td>
                            <td>
                                <select id="klan" name="klan">
                                    <option value="cien">Klan Cienia</option>
                                    <option value="grom">Klan Gromu</option>
                                    <option value="wicher">Klan Wichru</option>
                                    <option value="rzeka">Klan Rzeki</option>
                                    <option value="pnk">Plemię</option>
                                    <option value="samotnik">Samotnik</option>
                                    <option value="gk">Gwiezndy Klan</option>
                                    <option value="cl">Ciemny Las</option>
                                    <option value="nkt">Nieaktywny</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="ranga">Ranga: </label></td>
                            <td><input type="text" id="ranga" name="ranga"></td>
                        </tr>
                        <tr>
                            <td><label for="avek">Awatar: </label></td>
                            <td><input type="url" id="avek" name="avek"></td>
                        </tr>
                        <tr>
                            <td><label for="toyhouse">Toyhouse: </label></td>
                            <td><input type="text" id="toyhouse" name="toyhouse"></td>
                        </tr>
                    </table>
                <h2>Statystyki podstawowe</h2>
                <table>
                    <tr>
                        <td style="width: 95px;">Poziom</td>
                        <td><input type="number" id="lvl" min=1 value="1"></input></td>
                    </tr>
                    <tr>
                        <td style="width: 95px;">Siła</td>
                        <td><input type="number" id="s" min=1 value="1"></input></td>
                    </tr>
                    <tr>
                        <td style="width: 95px;">Zręczność</td>
                        <td><input type="number" id="zr" min=1 value="1"></input></td>
                    </tr>
                    <tr>
                        <td style="width: 95px;">Szybkość</td>
                        <td><input type="number" id="sz" min=1 value="1"></input></td>
                    </tr>
                    <tr>
                        <td style="width: 95px;">Odporność</td>
                        <td><input type="number" id="o" min=1 value="1"></input></td>
                    </tr>
                    <tr>
                        <td style="width: 95px;">HP</td>
                        <td><input type="number" id="hp" min=50 value="50"></input></td>
                    </tr>
                    <tr>
                        <td style="width: 95px;">Wytrzymałość</td>
                        <td><input type="number" id="w" min=50 value="50"></input></td>
                    </tr>
                </table>

                <button type="submit" id="btnGuardar">Zachowaj postać</button>
            </form>

            <div id="mensaje"></div>
        </div>

        <script>
            const form = document.getElementById('characterForm');
            const mensajeDiv = document.getElementById('mensaje');
            const btnGuardar = document.getElementById('btnGuardar');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                btnGuardar.disabled = true;
                btnGuardar.innerText = "Zapisywanie postaci...";
                mensajeDiv.innerText = "";

                const formData = {
                    id: document.getElementById('id').valueAsNumber,
                    imie: document.getElementById('imie').value,
                    klan: document.getElementById('klan').value,
                    ranga: document.getElementById('ranga').value,
                    avek: document.getElementById('avek').value,
                    s: document.getElementById('s').value,
                    zr: document.getElementById('zr').value,
                    sz: document.getElementById('sz').value,
                    o: document.getElementById('o').value,
                    hp: document.getElementById('hp').value,
                    w: document.getElementById('w').value
                };

                try {
                    const response = await fetch('api/insert.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();

                    // 3. Manejar respuesta
                    if (response.ok && data.status === 'ok') {
                        mensajeDiv.className = 'exito';
                        mensajeDiv.innerText = "Postać została zapisana!";
                        form.reset(); //
                    } else {
                        throw new Error(data.message || 'Wystąpił bład! Skontaktuj się z Nath');
                    }

                } catch (error) {
                    mensajeDiv.className = 'error';
                    mensajeDiv.innerText = "Error: " + error.message;
                    console.error(error);
                } finally {
                    btnGuardar.disabled = false;
                    btnGuardar.innerText = "Zapisz";
                }
            });
        </script>
    </main>
    <footer>mancoteam © 2026 | for Starlight rp</footer>
    <script src="script/app.js"></script>
</body>
</html>
